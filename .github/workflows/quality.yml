name: Watchtower Crypto quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run quality
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install chromium
      - run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/wtc-server.log 2>&1 &
          sleep 2
      - run: node tests/browser-smoke.mjs
